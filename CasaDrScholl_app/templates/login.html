{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Clinica Dr. Scholl</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app-theme.css' %}">
</head>
<body class="login-shell">
    <main class="login-layout">
        <section class="login-intro">
            <img src="{% static 'imagenes/DrScholls_color_logo.png' %}" alt="Clinica Dr. Scholl">
            <p class="login-kicker">Clinica del pie</p>
            <h1>Atencion clara para cada cita, cliente y servicio.</h1>
            <p>
                Gestiona el dia con una vista ordenada y rapida para el equipo administrativo y operativo.
            </p>
        </section>

        <section class="login-card">
            <div class="login-card-header">
                <p class="login-kicker">Acceso interno</p>
                <h2>Iniciar sesion</h2>
            </div>

            <form method="post" autocomplete="off">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        autocomplete="off"
                        value="{{ selected_username }}"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    Ingresar
                </button>

                {% if error %}
                    <div class="alert alert-danger mt-3 text-center">
                        {{ error }}
                    </div>
                {% endif %}
            </form>
        </section>
    </main>
</body>
</html>
